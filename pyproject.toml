[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "figure-skating-aqa-gatv2"
version = "0.1.0"
description = "Siamese GATv2 for Figure Skating Action Quality Assessment"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
