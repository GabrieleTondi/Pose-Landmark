paths:
  raw_finefs_dir: "data/raw/finefs"
  raw_mmfs_dir: "data/raw/mmfs"
  intermediate_dir: "data/intermediate"
  processed_dir: "data/processed"
  splits_dir: "data/splits"
  reports_dir: "reports"
  checkpoints_dir: "checkpoints"

dataset:
  primary_dataset: "finefs"
  enable_mmfs: false
  skeleton_convention: "h36m17"  # Verified on FineFS data/raw/finefs/skeleton/*.npz (Human3.6M 17-joint)
  target_elements:
    - "Camel Spin"
    - "Sit Spin"
    - "Layback Spin"

windowing:
  window_size: 9
  min_valid_frames: 5
  trim_ratio_start: 0.20
  trim_ratio_end: 0.20
  min_keypoint_confidence: 0.20
  selection_mode: "center"      # "center" captures the true spin hold; "min_jitter" biases toward slow entry/exit glides

canonicalization:
  horizontal_axes: [0, 1]       # Horizontal axes: 0=X, 1=Y (Z verified as vertical on FineFS)
  vertical_axis: 2              # Vertical axis: 2=Z
  scale_epsilon: 1.0e-4
  yaw_epsilon: 1.0e-4
  # Indices for H36M-17 standard verified on FineFS:
  pelvis_indices: [4, 1]        # [left_hip, right_hip]
  shoulder_indices: [11, 14]    # [left_shoulder, right_shoulder]
  canonicalize_supporting_leg: false
  ankle_indices: [6, 3]         # [left_ankle, right_ankle]
  symmetric_joint_pairs:
    - [1, 4]    # right_hip <-> left_hip
    - [2, 5]    # right_knee <-> left_knee
    - [3, 6]    # right_ankle <-> left_ankle
    - [14, 11]  # right_shoulder <-> left_shoulder
    - [15, 12]  # right_elbow <-> left_elbow
    - [16, 13]  # right_wrist <-> left_wrist

splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
