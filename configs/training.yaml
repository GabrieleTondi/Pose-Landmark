model:
  in_channels: 3
  edge_dim: 5
  hidden_dim: 32
  embed_dim: 32
  heads: 4
  dropout: 0.0                    # Validato su FineFS val: dropout > 0 induce collasso latente su triplette Siamesi 17-nodi
  normalize_embeddings: false

training:
  seed: 42
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  max_epochs: 80
  early_stopping_patience: 15
  grad_clip_max_norm: 1.0
  num_train_triplets_per_epoch: 600
  num_val_triplets: 200
  num_test_triplets: 200

sampling:
  tier_rule: "threshold"          # "threshold" (con fallback automatico a "quantile" se pool < 5)
  goe_pos_threshold: 1.5
  goe_neg_threshold: 0.0
  goe_pos_quantile: 0.70
  goe_neg_quantile: 0.35
  max_pos_goe_diff: 1.5
  min_neg_goe_gap: 1.5
  real_negative_prob: 0.70
  positive_top_k: 8               # Solo su train: seleziona P tra i K positivi più affini per evitare conflitti di variante
  self_synth_prob: 0.20           # Riduce sovra-campionamento di self-negativi rispetto ai cross-negativi

augmentation:
  enabled: true
  num_synthetic_per_positive: 3   # 1 per ciascun tier (1=lieve, 2=medio, 3=grave)
  noise_std: 0.005
  tier_angle_ranges_deg:
    1: [8.0, 15.0]
    2: [16.0, 28.0]
    3: [29.0, 42.0]

loss:
  margin_mode: "adaptive"         # "adaptive" oppure "fixed"
  fixed_margin: 0.50
  adaptive_margins:
    1: 0.20
    2: 0.60
    3: 1.00
  var_reg_weight: 0.35            # Regolarizzazione anti-collasso della deviazione standard latente (solo training)
  var_reg_target: 1.0

